name: AuditReady browser regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0 pdfjs-dist@3.11.174
          node -e "require('fs').copyFileSync('node_modules/pdfjs-dist/build/pdf.min.js' ,'pdf.min.js')"
          npx playwright install --with-deps chromium
      - name: Run privacy-safe browser regression
        run: node tests/real-doc-e2e.mjs
      - name: Upload regression summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditready-browser-regression
          path: |
            test-artifacts/regression-summary.txt
            test-artifacts/regression-result.png
          if-no-files-found: ignore
