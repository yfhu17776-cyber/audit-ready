name: AuditReady real-document browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-real-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real public insurance-document E2E
        run: node tests/real-doc-e2e.mjs
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditready-real-doc-e2e
          path: test-artifacts/
          if-no-files-found: ignore
